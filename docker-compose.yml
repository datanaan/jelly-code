# ============================================================
# jelly-code - 后端基础设施 (docker compose)
#
# 管理命令:
#   docker compose up -d     启动
#   docker compose down      停止
#   docker compose ps        状态
#   docker compose logs -f   日志
#
# 注意: jelly-code 应用本体和 Qdrant 由 systemd 直接管理，不在此文件
#
# 配置:
#   - 创建 .env 文件并设置 NEO4J_PASSWORD 和 TYPESENSE_API_KEY
#   - 默认密码/密钥仅供开发使用
# ============================================================

services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - /data/neo4j-data:/data
      - /data/neo4j-data/conf/neo4j.conf:/conf/neo4j.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/7687' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  typesense:
    image: typesense/typesense:26.0
    container_name: typesense
    ports:
      - "8108:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-key}
    volumes:
      - /data/typesense-data:/data
    command: [--data-dir, /data, --api-key, ${TYPESENSE_API_KEY:-dev-key}]
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/localhost/8108' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
