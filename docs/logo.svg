<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f5af0"/>
      <stop offset="100%" style="stop-color:#2cb67d"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect x="20" y="20" width="360" height="360" rx="80" ry="80" fill="url(#bg)"/>

  <!-- Hexagon node symbolizing knowledge graph -->
  <polygon points="200,80 290,130 290,270 200,320 110,270 110,130"
           fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.3"/>

  <!-- Inner hexagon -->
  <polygon points="200,110 265,147 265,253 200,290 135,253 135,147"
           fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>

  <!-- Connection lines (graph edges) -->
  <line x1="200" y1="110" x2="265" y2="147" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="265" y1="147" x2="265" y2="253" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="265" y1="253" x2="200" y2="290" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="135" y1="147" x2="135" y2="253" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="135" y1="147" x2="200" y2="110" stroke="#7f5af0" stroke-width="1.5" opacity="0.4"/>
  <line x1="135" y1="253" x2="200" y2="290" stroke="#7f5af0" stroke-width="1.5" opacity="0.4"/>

  <!-- Nodes (symbols in graph) -->
  <circle cx="200" cy="80" r="10" fill="url(#accent)" opacity="0.9"/>
  <circle cx="290" cy="130" r="7" fill="#2cb67d" opacity="0.8"/>
  <circle cx="290" cy="270" r="7" fill="#00d2ff" opacity="0.8"/>
  <circle cx="200" cy="320" r="10" fill="url(#accent)" opacity="0.9"/>
  <circle cx="110" cy="270" r="7" fill="#7f5af0" opacity="0.8"/>
  <circle cx="110" cy="130" r="7" fill="#2cb67d" opacity="0.8"/>

  <!-- Center node (the J in jelly) -->
  <circle cx="200" cy="200" r="45" fill="url(#accent)" opacity="0.15"/>
  <circle cx="200" cy="200" r="30" fill="url(#accent)" opacity="0.3"/>

  <!-- J letter in center -->
  <text x="200" y="218" font-family="'Courier New', monospace" font-size="50"
        font-weight="bold" fill="url(#accent)" text-anchor="middle" opacity="0.95">J</text>

  <!-- Small orbiting dots -->
  <circle cx="200" cy="155" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="245" cy="200" r="3" fill="#7f5af0" opacity="0.6"/>
  <circle cx="200" cy="245" r="3" fill="#2cb67d" opacity="0.6"/>
  <circle cx="155" cy="200" r="3" fill="#00d2ff" opacity="0.6"/>

  <!-- Code brackets -->
  <text x="85" y="355" font-family="'Courier New', monospace" font-size="18"
        fill="#00d2ff" opacity="0.3" text-anchor="middle">&lt;/&gt;</text>
  <text x="315" y="355" font-family="'Courier New', monospace" font-size="18"
        fill="#00d2ff" opacity="0.3" text-anchor="middle">{ }</text>
</svg>
